name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

# Read-only token. `pull_request` (never `pull_request_target`) gives forked PRs no secrets and no write access.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Lockfile-exact install; .npmrc sets ignore-scripts=true so dependency install scripts do not run.
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate research data
        run: npm run validate-data
      - name: Build site
        run: npx --no-install astro build
      - name: Check internal links
        run: npm run check-links
      - name: Security checks
        run: npm run check-security

  dependency-review:
    # Blocks pull requests that add dependencies with known high-severity advisories.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
