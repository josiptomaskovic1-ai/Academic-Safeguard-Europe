name: Methodology proposal / disagreement
description: Propose a change to the Standard, rubric or methodology, or record disagreement with it.
title: "[Methodology] "
labels: [methodology]
body:
  - type: markdown
    attributes:
      value: |
        Methodological disagreements are recorded publicly and considered for the next version. They do not change findings under the current version.
        **This issue is public** and stays in the repository history. Do not include personal data (names of staff or students, student IDs, contact details, health information), allegations about individuals, or confidential or non-public documents. Only submit publicly available documents.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A safeguard definition (S01-S12)
        - Level criteria in the rubric
        - Result values or verification rules
        - Research status definitions
        - Scope of the Standard
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text or rule
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change or point of disagreement
    validations:
      required: true
  - type: textarea
    id: reasons
    attributes:
      label: Reasons and evidence (e.g. how a national system achieves the same protection differently)
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Findings affected (record IDs), if any
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This submission contains no personal data and no allegations about individuals.
          required: true
