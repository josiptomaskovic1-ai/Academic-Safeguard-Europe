research_date: "2026-09-13"
evidence_note: >-
  The University of Zagreb's university-wide safeguards rest mainly on its Code of Ethics (2007, amended 2018),
  which prohibits harassment and misuse of authority. It sets out a procedure before ethics committees, with
  deadlines, written reasoned opinions and an appeal to the university Ethics Council. However, ethics
  opinions are expressly non-binding. Proceedings are formally requested by the dean or rector, not directly
  by a student, and the Code does not itself set disciplinary consequences. A Student Ombudsperson, appointed
  by the Student Council, receives complaints about student rights and mediates, but it has no decision-making
  powers set out in the sources reviewed. No university-wide rules were identified on interim academic
  protective measures, retaliation beyond harassment reports, remedies for academic harm linked to misconduct
  findings, or conduct review for supervisory roles.
