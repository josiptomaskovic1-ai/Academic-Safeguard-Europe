evidence_gaps:
  - No university-wide harassment rulebook or protocol applicable to students was identified. The Gender Equality Plan
    (section 2.5) proposes that a special university committee prepare instructions, an online reporting form and a
    standing protection mechanism, but no adopted instrument was found in the regulations lists reviewed.
  - The ethics system produces non-binding opinions (Code Art. 2(5)), and students cannot formally start proceedings
    themselves (Art. 33(2)).
  - No interim protective measures, no remedies for academic harm linked to misconduct findings, and no conduct review
    for supervisory roles were identified at university level.
  - Anti-retaliation protection is limited to people who reject or report harassment (Code Art. 12(5)).
  - No recusal rule was identified for members of ethics bodies.
  - Staff disciplinary offences and sanctions are not set out in the Statute (Art. 110). The relevant employment
    rulebook was not reviewed.
  - Many student-protection details (grade-objection deadlines, exam committee composition, harassment procedures) are
    delegated to faculty general acts. Faculty-level rules exist but were outside scope; search results indicated
    faculty-level harassment rules at, for example, the Faculty of Law, the Faculty of Humanities and Social Sciences and
    the Faculty of Mining, Geology and Petroleum Engineering. These were not opened or assessed.
