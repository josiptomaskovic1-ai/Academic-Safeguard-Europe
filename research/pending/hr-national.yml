jurisdiction: HR
scope: national
researched_by: agent-research-hr-national
research_date: "2026-09-13"
framework_summary: >-
  Croatia's Act on Higher Education and Scientific Activity (NN 119/2022) sets general duties for members of the
  academic community to respect the dignity of every person, and requires each higher education institution to
  establish an ethics committee, adopt an ethics code defining ethical offences and sanctioning procedures, establish
  a disciplinary committee and adopt a disciplinary rulebook for staff; the content of these instruments is left to
  institutions. Students have a statutory right to complain about violations of their rights and each institution
  must have a student ombudsperson (a student appointed by the student council under the 2007 Student Council Act),
  whose role is advisory and mediating. The Act declares the General Administrative Procedure Act applicable to
  procedures deciding on students' rights and obligations, which would bring recusal, deadline, reasoned-decision
  and appeal rules, but whether complaints about staff conduct fall within that route is not settled by the texts
  reviewed. Horizontal anti-discrimination and gender equality legislation prohibits harassment and sexual
  harassment (including in education), protects against victimisation for reporting discrimination and provides
  external routes to the People's Ombudsperson, the Gender Equality Ombudsperson and the courts. The national
  re-accreditation standards of the Agency for Science and Higher Education expect institutions to prevent and
  sanction unethical behaviour and discrimination through fair and impartial procedures and to operate a formal
  appeals procedure on assessment.
