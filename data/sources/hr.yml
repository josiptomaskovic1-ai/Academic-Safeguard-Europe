  - id: hr-unizg-ethics-code-2007
    title: Etički kodeks Sveučilišta u Zagrebu
    title_en: Code of Ethics of the University of Zagreb
    issuing_body: University of Zagreb (Senate)
    url: https://www.unizg.hr/fileadmin/rektorat/O_Sveucilistu/Dokumenti_javnost/Propisi/Pravilnici/Eticki_kodeks.pdf
    document_type: code_of_ethics
    country: HR
    institution: hr-unizg
    publication_date: 2007-05-18
    official_reference: "KLASA: 012-03/07-03/2, URBROJ: 380-07/1-09-5"
    accessed: 2026-09-13
    language: hr
    archived_url: null
    notes: "Adopted by the Senate on 15 May 2007 under the 2005 Statute. Article 41 says it entered into force on
      publication, 18 May 2007. The published file is the 2009 print edition. It is still linked from the
      university regulations page, but it predates the 2023 Statute. No re-adopted or consolidated version was
      found, so currency relative to the 2023 Statute is not confirmed. The 2018 amendments are published
      separately (see hr-unizg-ethics-code-amend-2018). Currency caveat: the Code was adopted under the 2005
      Statute. Article 129(1) of the 2023 Statute provides that acts adopted under the previous Statute apply
      until 1 October 2024; no re-adopted Code was found, although the 2007 text remains published on the
      University's regulations page (checked 2026-09-13). Its continued legal force after that date could not
      be confirmed."
  - id: hr-unizg-ethics-code-amend-2018
    title: Odluka o izmjenama i dopunama Etičkog kodeksa Sveučilišta u Zagrebu
    title_en: Decision on Amendments to the Code of Ethics of the University of Zagreb
    issuing_body: University of Zagreb (Senate)
    url: https://www.unizg.hr/fileadmin/rektorat/O_Sveucilistu/Dokumenti_javnost/Propisi/Pravilnici/odluka-o-izmjenama-i-dopunama-Etickog-kodeksa-Sveucilista-u-Zagrebu_13_11_2018.pdf
    document_type: regulation
    country: HR
    institution: hr-unizg
    publication_date: 2018-11-14
    official_reference: "Klasa: 012-03/18-03/12, Urbroj: 380-020/173-18-3"
    accessed: 2026-09-13
    language: hr
    archived_url: null
    notes: Adopted on 13 November 2018, published 14 November 2018, in force 22 November 2018. The PDF is a
      scanned image; its two pages were read visually after rendering. It amends Art. 34(2) and (6), adds Art.
      35(8)-(10) on appeals, and amends Art. 36. Item I adds representation by proxy for the person whose
      conduct is examined (Art. 34(2)); item II amends Art. 34(6) so that committees must verify the
      allegations to establish the relevant facts; items III–IV introduce the appeal to the Ethics Council.
