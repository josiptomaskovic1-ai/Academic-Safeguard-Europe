  - id: hr-unizg-statute-2023
    title: Statut Sveučilišta u Zagrebu
    title_en: Statute of the University of Zagreb
    issuing_body: University of Zagreb (Senate)
    url: https://www.unizg.hr/fileadmin/rektorat/O_Sveucilistu/Dokumenti_javnost/Dokumenti/Strateski_dokumenti/statut/Statut_SUZG_ZAVRSNO_fin_fin_travanj2023.pdf
    document_type: statute
    country: HR
    institution: hr-unizg
    publication_date: null
    official_reference: null
    accessed: 2026-09-13
    language: hr
    archived_url: null
    notes: Adopted by the Senate on 21 March 2023 under the Act on Higher Education and Scientific Activity (NN
      119/22). The regulations web page lists it as the current statute. Article 129 required university
      general acts to be aligned with it by 1 October 2024. Text was read via local text extraction of the PDF
      fetched from unizg.hr.
