  - id: hr-zzpn-2022
    title: Zakon o zaštiti prijavitelja nepravilnosti
    title_en: Act on the Protection of Whistleblowers (Reporters of Irregularities)
    issuing_body: Croatian Parliament (Hrvatski sabor)
    url: https://narodne-novine.nn.hr/clanci/sluzbeni/2022_04_46_572.html
    document_type: legislation
    country: HR
    institution: null
    publication_date: 2022-04-15
    official_reference: NN 46/2022, 136/2025
    accessed: 2026-09-13
    language: hr
    archived_url: null
    notes: Official gazette text of the original act. Amended by NN 136/2025 (text viewed at
      https://www.zakon.hr/c/nn/671302/nn-136-2025-%285.11.2025.%29%2C-zakon-o-izmjenama-i-dopunama-zakona-o-zastiti-prijavitelja-nepravilnosti);
      the amendment extends material scope, adds protection for reports made directly to police or the State
      Attorney, sets court deadlines and converts fines to euro, but does not change the Article 6 definitions
      of reporter and work-related context.
