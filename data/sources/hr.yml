sources:
  - id: hr-azvo-reaccreditation-standards-2023
    title: Standardi kvalitete za vrednovanje u postupku reakreditacije visokih učilišta
    title_en: Quality standards for evaluation in the re-accreditation procedure of higher education institutions
    issuing_body: Accreditation Council, Agency for Science and Higher Education (Agencija za znanost i visoko
      obrazovanje, AZVO)
    url: https://www.azvo.hr/wp-azvo-files/uploads/2024/05/Standardi-kvalitete-za-vrednovanje-u-postupku-reakreditacije-visokih-ucilista.pdf
    document_type: standard
    country: HR
    institution: null
    publication_date: 2023-09-14
    official_reference: KLASA 602-04/23-02/169
    accessed: 2026-09-13
    language: hr
    archived_url: null
    notes: Adopted by the Accreditation Council on 2023-07-06 under Article 8(3) of the Act on Quality Assurance
      in Higher Education and Science (NN 151/22); document dated 2023-09-14. The Quality Assurance Act itself
      was not opened. Standards are evaluation criteria for re-accreditation rather than directly binding
      conduct rules. The evidence lists attached to each standard are expressly examples only.
